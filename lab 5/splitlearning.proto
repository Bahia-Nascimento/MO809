syntax = "proto3";
package splitlearning;

// U-Shaped: este contrato NÃO possui campos de imagens, rótulos ou loss.
// Dois RPCs completam um lote: forward de M2 e backward de M2.
service SplitLearning {
  rpc GetInfo(Empty) returns (Info);
  rpc Forward(ClientToServer) returns (ServerToClient);
  rpc Backward(ClientToServer) returns (ServerToClient);
  rpc Evaluate(ClientToServer) returns (ServerToClient);
  rpc SaveCheckpoint(Empty) returns (Info);
  rpc LoadCheckpoint(Empty) returns (Info);
}
message Empty {}
message ClientToServer {
  repeated float values = 1;
  int32 batch_size = 2;
  int32 client_id = 3;
  int64 step = 4;
  string token = 5;
}
message ServerToClient {
  repeated float values = 1;
  int32 batch_size = 2;
  int64 step = 3;
  string token = 4;
}
message Info {
  string instance_id = 1;
  int64 updates = 2;
  int32 pid = 3;
  string device = 4;
  int32 clients = 5;
}
